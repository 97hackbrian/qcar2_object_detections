# =============================================================================
# QCar2 Object Detections - Configuration Parameters
# =============================================================================

image_preprocessor_node:
  ros__parameters:
    input_image_topic: "/camera/csi_image_2"
    
    #input_image_topic: "/camera/color_image"
    
    output_image_topic: "/image"
    input_width: 820
    input_height: 616

    #input_width: 640
    #input_height: 480

    target_width: 640
    target_height: 640
    padding_color: [0, 0, 0]
    input_encoding: "bgr8"
    yolo_confidence_threshold: 0.15

    # ===================== MASTER FILTER SWITCH =====================
    # When false, ALL image filters are skipped (CLAHE, gamma, brightness,
    # sharpen, saturation). The node only does resize + letterbox padding.
    # Use false to minimize CPU usage when Cartographer needs more resources.
    # Changeable at runtime: ros2 param set /image_preprocessor_node filters_enabled false
    filters_enabled: true

    # ===================== CLAHE (Contrast Enhancement) =====================
    # CLAHE = Contrast Limited Adaptive Histogram Equalization
    # Improves contrast for better object detection, especially for bright objects
    clahe_enabled: false
    clahe_clip_limit: 5.0      # Limit for contrast amplification (2.0-5.0 recommended, INCREASED for better contrast)
    clahe_tile_size: 15        # Size of tiles for local contrast (8, 16, 32 common)
    
    # Optional: Brightness adjustment after CLAHE
    brightness_adjustment: -1.0  # Range: -50 to +50 (0 = no adjustment)

    # ===================== GAMMA & SHARPEN (disabled) =====================
    gamma_correction: 3        # Gamma for brightness curve (1.0 = no correction)
    sharpen_image: true        # Unsharp mask sharpening

detection_filter_node:
  ros__parameters:
    # ----------------- Inputs -----------------
    image_topic: "/image"
    detections_input_topic: "/detections_output"
    zebra_image_topic: "/camera/csi_image_2"

    # ----------------- Outputs ----------------
    person_output_topic: "/detections/person"
    traffic_light_output_topic: "/detections/traffic_light"
    stop_sign_output_topic: "/detections/stop_sign"
    zebra_output_topic: "/detections/zebra_crossing"

    # ----------------- Class IDs -----------------
    person_class_id: "0"
    traffic_light_class_id: "9"
    stop_sign_class_id: "11"

    # ----------------- Thresholds ----------------
    min_confidence: 0.10

    # ===================== DEBUG VIEWS =====================
    person_debug_view: false
    person_window_name: "person_debug"

    stop_sign_debug_view: false
    stop_sign_window_name: "stop_debug"

    traffic_light_debug_view: false

    zebra_debug_view: false
    zebra_window_name: "zebra_debug"

    # ===================== DEBUG IMAGE (integrated visualizer) =====================
    debug_image_enabled: true
    output_image_topic: "/detections/debug_image"
    debug_publish_hz: 5.0
    debug_output_width: 320
    debug_output_height: 320

    # ===================== PERSON (ROI en %) =====================
    person_roi_x_min: 0.3
    person_roi_x_max: 0.7
    person_roi_y_min: 0.70
    person_roi_y_max: 0.95
    person_min_bbox_area: 10000
    person_confirm_frames_on: 2
    person_confirm_frames_off: 8

    # ===================== STOP SIGN (ROI en %) =====================
    stop_sign_roi_x_min: 0.79
    stop_sign_roi_x_max: 1.0
    stop_sign_roi_y_min: 0.2
    stop_sign_roi_y_max: 0.45
    stop_sign_min_bbox_area: 2000  # Minimum bounding box area to detect stop sign

    #Con estos valores el robot para muy antes
    #stop_sign_roi_x_min: 0.62
    #stop_sign_roi_x_max: 1.0
    #stop_sign_roi_y_min: 0.25
    #stop_sign_roi_y_max: 0.75

    # ===================== ZEBRA =====================
    zebra_enabled: false
    zebra_roi_top: 0.75
    zebra_roi_bottom: 0.99
    zebra_roi_width: 0.8
    zebra_min_stripes: 5
    zebra_max_stripes: 13
    zebra_vote_threshold: 2
    zebra_vote_window: 8

    # ===================== TRAFFIC LIGHT =====================
    traffic_light_roi_x_min: 0.25
    traffic_light_roi_x_max: 0.75
    traffic_light_roi_y_min: 0.35
    traffic_light_roi_y_max: 0.48
    traffic_light_min_bbox_area: 300
    traffic_light_confirm_frames: 2

    traffic_light_sensitivity: 2 # mejor dif entre rojo y verde

    traffic_light_red_lower_h: 0
    traffic_light_red_lower_s: 160
    traffic_light_red_lower_v: 160
    traffic_light_red_upper_h: 10
    traffic_light_red_upper_s: 255
    traffic_light_red_upper_v: 255

    traffic_light_yellow_lower_h: 20
    traffic_light_yellow_lower_s: 30
    traffic_light_yellow_lower_v: 240
    traffic_light_yellow_upper_h: 25
    traffic_light_yellow_upper_s: 100
    traffic_light_yellow_upper_v: 255

    traffic_light_green_lower_h: 26
    traffic_light_green_lower_s: 140
    traffic_light_green_lower_v: 140
    traffic_light_green_upper_h: 150
    traffic_light_green_upper_s: 255
    traffic_light_green_upper_v: 205

# =============================================================================
# Image Compressor Node
# =============================================================================
image_compressor_node:
  ros__parameters:
    input_topic: "/yolov8_processed_image"
    output_topic: "/yolov8_processed_image/compressed"
    jpeg_quality: 70
